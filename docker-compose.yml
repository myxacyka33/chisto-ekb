services:
  db:
    image: postgres:16-alpine
    container_name: chisto_ekb_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chisto_ekb
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    container_name: chisto_ekb_web
    restart: unless-stopped
    depends_on:
      - db
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./app/static/uploads:/code/app/static/uploads

volumes:
  pgdata: